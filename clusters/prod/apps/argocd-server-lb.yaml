apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-server-lb
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/donneypr/homelab.git
    targetRevision: main
    path: clusters/prod/manifests/argocd-server-lb
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
