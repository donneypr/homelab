---
- name: Baseline all cluster nodes
  hosts: k3s_cluster
  become: true
  roles:
    - common

- name: Bring up the first K3s server
  hosts: k3s-1
  become: true
  tasks:
    - name: Install K3s with embedded etcd
      ansible.builtin.shell:
        cmd: >
          curl -sfL https://get.k3s.io |
          INSTALL_K3S_EXEC="server --cluster-init
          --token {{ k3s_token }}
          --tls-san {{ ansible_host }}
          {% for c in k3s_disable %}--disable {{ c }} {% endfor %}"
          sh -
        creates: /usr/local/bin/k3s

    - name: Wait for the API to answer
      ansible.builtin.wait_for:
        port: 6443
        host: 127.0.0.1
        timeout: 180

- name: Join the remaining servers
  hosts: k3s_cluster:!k3s-1
  become: true
  serial: 1
  tasks:
    - name: Install K3s and join the cluster
      ansible.builtin.shell:
        cmd: >
          curl -sfL https://get.k3s.io |
          INSTALL_K3S_EXEC="server
          --server https://{{ hostvars['k3s-1'].ansible_host }}:6443
          --token {{ k3s_token }}
          --tls-san {{ ansible_host }}
          {% for c in k3s_disable %}--disable {{ c }} {% endfor %}"
          sh -
        creates: /usr/local/bin/k3s

- name: Fetch kubeconfig to the control machine
  hosts: k3s-1
  become: true
  tasks:
    - name: Read the generated kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig_raw

    - name: Write it locally with the right server address
      ansible.builtin.copy:
        content: >-
          {{ kubeconfig_raw.content | b64decode
             | replace('127.0.0.1', ansible_host) }}
        dest: "{{ playbook_dir }}/../kubeconfig"
        mode: "0600"
      delegate_to: localhost
      become: false
