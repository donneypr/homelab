---
- name: Baseline all cluster nodes
  hosts: k3s_cluster
  become: true
  roles:
    - common

- name: Bring up the first K3s server
  hosts: k3s-1
  become: true
  tasks:
    - name: Install K3s with embedded etcd
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >
          set -o pipefail;
          curl -sfL https://get.k3s.io |
          INSTALL_K3S_EXEC="server --cluster-init
          --token {{ k3s_token }}
          {% for h in groups['k3s_cluster'] %}--tls-san {{ hostvars[h].ansible_host }} {% endfor %}
          {% for c in k3s_disable %}--disable {{ c }} {% endfor %}"
          sh -
        creates: /usr/local/bin/k3s

    - name: Wait for the API to answer
      ansible.builtin.wait_for:
        port: 6443
        host: 127.0.0.1
        timeout: 180

- name: Join the remaining servers
  hosts: k3s_cluster:!k3s-1
  become: true
  serial: 1
  tasks:
    - name: Install K3s and join the cluster
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >
          set -o pipefail;
          curl -sfL https://get.k3s.io |
          INSTALL_K3S_EXEC="server
          --server https://{{ hostvars['k3s-1'].ansible_host }}:6443
          --token {{ k3s_token }}
          {% for h in groups['k3s_cluster'] %}--tls-san {{ hostvars[h].ansible_host }} {% endfor %}
          {% for c in k3s_disable %}--disable {{ c }} {% endfor %}"
          sh -
        creates: /usr/local/bin/k3s

- name: Fetch kubeconfig to the control machine
  hosts: k3s-1
  become: true
  tasks:
    - name: Read the generated kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig_raw

    - name: Write it locally with the right server address
      ansible.builtin.copy:
        content: >-
          {{ kubeconfig_raw.content | b64decode
             | replace('127.0.0.1', ansible_host) }}
        dest: "{{ playbook_dir }}/../kubeconfig"
        mode: "0600"
      delegate_to: localhost
      become: false

- name: Bootstrap Argo CD
  hosts: k3s-1
  become: true
  vars:
    argocd_version: v3.4.6
  tasks:
    - name: Create the argocd namespace
      ansible.builtin.command:
        cmd: k3s kubectl create namespace argocd
      register: ns
      changed_when: ns.rc == 0
      failed_when: ns.rc != 0 and 'AlreadyExists' not in ns.stderr

    - name: Install Argo CD
      ansible.builtin.command:
        cmd: >
          k3s kubectl apply -n argocd --server-side --force-conflicts -f
          https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml
      register: install
      changed_when: "'serverside-applied' in install.stdout"

    - name: Wait for the Argo CD server to come up
      ansible.builtin.command:
        cmd: >
          k3s kubectl wait -n argocd --for=condition=Available
          deployment/argocd-server --timeout=600s
      changed_when: false

    - name: Copy the root Application to the node
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../clusters/prod/bootstrap/root-app.yaml"
        dest: /tmp/root-app.yaml
        mode: "0644"

    - name: Apply the root Application
      ansible.builtin.command:
        cmd: k3s kubectl apply -f /tmp/root-app.yaml
      register: root
      changed_when: "'created' in root.stdout or 'configured' in root.stdout"
